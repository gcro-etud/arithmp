name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: astral-sh/setup-uv@v3
        
      - name: Build package
        run: uv build
        
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*